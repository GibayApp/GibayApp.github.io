<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada | Gibay</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
            line-height: 1.6;
        }

        .content {
            background: #f5f5f5;
            padding: 30px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .button {
            display: inline-block;
            background: #5835BA;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 5px;
            margin: 10px 5px;
        }

        .button:hover {
            background: #7E57C2;
        }

        .button-appstore {
            background: #111111;
        }

        .button-appstore:hover {
            background: #333333;
        }

        .button-outline {
            background: transparent;
            color: #5835BA;
            border: 2px solid #5835BA;
        }

        .button-outline:hover {
            background: #f7f5fc;
        }

        h1 {
            color: #5835BA;
        }
    </style>
</head>

<body>
    <div class="content">
        <img src="https://gibayapp.github.io/images/logo.png" alt="Gibay Logo" style="max-width: 250px; margin-bottom: 20px;">
        <h1>Página no encontrada</h1>
        <p>La página que buscas no existe o ha sido movida.</p>
        <p>Descarga Gibay en iOS o Android, o vuelve al inicio del sitio.</p>

        <div class="store-buttons">
            <a href="https://play.google.com/store/apps/details?id=com.gibay.app" class="button">Google Play</a>
            <a href="https://apps.apple.com/es/app/id6786309439" class="button button-appstore">App Store</a>
            <a href="home.html" class="button button-outline">Ir al inicio</a>
        </div>
    </div>
</body>

</html>
